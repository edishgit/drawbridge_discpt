<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" width="1440" height="1100"><title>Drawbridge — Inbox simulator / crash proof</title><rect width="1440" height="1100" fill="#ffffff"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#0b1220"/><text x="28" y="39" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Vendor inbox simulator</text><text x="276" y="39" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">leah@nimbuswrite.ai</text><rect x="1020" y="21" width="338" height="22" rx="11" fill="#172554" stroke="#93c5fd" stroke-width="1"/><text x="1189.0" y="35.96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#93c5fd" font-weight="600" text-anchor="middle">SIMULATED MAIL CHANNEL · SMTP-adapter compatible</text><rect x="0" y="64" width="1440" height="836" rx="0" fill="#f8fafc"/><rect x="28" y="96" width="1384" height="86" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="56" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#15803d" font-weight="800" text-anchor="start">1 message.</text><text x="212" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="400" text-anchor="start">The runtime was killed at 09:14:22 and restarted at 09:14:51, mid-send. The vendor received exactly one questionnaire.</text><text x="56" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">idem_key  rev_7f3a91:questionnaire_send:v1  ·  status done  ·  claimed 09:14:19  ·  completed 09:14:20  ·  replay at 09:14:53 returned the recorded result</text><rect x="28" y="204" width="1384" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="56" y="236" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="800" text-anchor="start">INBOX</text><rect x="56" y="252" width="1328" height="72" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Northwind Systems</text><text x="80" y="304" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">Security review — Northwind Systems</text><text x="1360" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="end">09:14:20</text><rect x="1200" y="296" width="106" height="22" rx="11" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="1253.0" y="310.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#15803d" font-weight="600" text-anchor="middle">DELIVERED ONCE</text><text x="56" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start" font-style="italic">No other messages. No duplicate. No retry storm.</text><text x="56" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">The gateway attempted the send twice — once before the crash and once during replay after restart.</text><text x="56" y="422" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">The second attempt was refused by the idempotency ledger before it reached the mail channel.</text><rect x="56" y="446" width="1328" height="42" rx="8" fill="#0b1220"/><text x="76" y="472" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#86efac" font-weight="400" text-anchor="start">09:14:53  idempotency  SKIP  rev_7f3a91:questionnaire_send:v1 already done — side effect not re-executed</text><rect x="28" y="528" width="676" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="56" y="560" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="800" text-anchor="start">WHAT THE OPERATOR SAW</text><text x="56" y="588" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">09:14:19</text><rect x="130" y="577" width="3" height="14" rx="2" fill="#1d4ed8"/><text x="142" y="588" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="start">checkpoint</text><text x="246" y="588" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">step questionnaire_send started</text><text x="56" y="617" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">09:14:19</text><rect x="130" y="606" width="3" height="14" rx="2" fill="#1d4ed8"/><text x="142" y="617" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="start">idempotency</text><text x="246" y="617" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">claim taken, status in_progress</text><text x="56" y="646" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">09:14:20</text><rect x="130" y="635" width="3" height="14" rx="2" fill="#15803d"/><text x="142" y="646" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#15803d" font-weight="700" text-anchor="start">gateway</text><text x="246" y="646" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">send permitted, token spent</text><text x="56" y="675" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">09:14:22</text><rect x="130" y="664" width="3" height="14" rx="2" fill="#b91c1c"/><text x="142" y="675" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#b91c1c" font-weight="700" text-anchor="start">runtime</text><text x="246" y="675" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">SIGKILL — process terminated</text><text x="56" y="704" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">09:14:22</text><rect x="130" y="693" width="3" height="14" rx="2" fill="#b45309"/><text x="142" y="704" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#b45309" font-weight="700" text-anchor="start">dashboard</text><text x="246" y="704" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">review parked, current_step visible</text><text x="56" y="733" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">09:14:51</text><rect x="130" y="722" width="3" height="14" rx="2" fill="#1d4ed8"/><text x="142" y="733" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="start">runtime</text><text x="246" y="733" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">restarted, replaying plan</text><text x="56" y="762" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">09:14:53</text><rect x="130" y="751" width="3" height="14" rx="2" fill="#15803d"/><text x="142" y="762" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#15803d" font-weight="700" text-anchor="start">idempotency</text><text x="246" y="762" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">already done — skipped</text><text x="56" y="791" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">09:14:53</text><rect x="130" y="780" width="3" height="14" rx="2" fill="#15803d"/><text x="142" y="791" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#15803d" font-weight="700" text-anchor="start">runtime</text><text x="246" y="791" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="400" text-anchor="start">resumed at evidence_review</text><rect x="736" y="528" width="676" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="764" y="560" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="800" text-anchor="start">WHAT THE VENDOR SAW</text><text x="764" y="606" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#0f172a" font-weight="700" text-anchor="start">One email.</text><text x="764" y="640" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">That is the entire claim. An enterprise workflow that</text><text x="764" y="660" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">runs for weeks will be interrupted — by a deploy, a</text><text x="764" y="680" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">quota, a crash. The question is never whether it stops,</text><text x="764" y="700" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">it is what the outside world experiences when it starts</text><text x="764" y="720" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">again.</text><rect x="764" y="742" width="616" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="788" y="768" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#14532d" font-weight="400" text-anchor="start">For email, the safe default is do not resend and flag for confirmation —</text><text x="788" y="786" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#14532d" font-weight="400" text-anchor="start">the conservative choice a security product should make.</text><circle cx="1392" cy="120" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1392" y="125" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="1392" cy="240" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1392" y="245" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="676" cy="552" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="676" y="557" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="1392" cy="552" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1392" y="557" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><rect x="0" y="900" width="1440" height="200" rx="0" fill="#0b1220"/><text x="28" y="932" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" font-weight="700" text-anchor="start">WHY IT LOOKS LIKE THIS</text><circle cx="41.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="41.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="64.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Lead with the number</text><text x="28.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">&#x27;1 message&#x27; in green, at the top, before any</text><text x="28.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">explanation. The proof is a count — everything under it</text><text x="28.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">is the audit trail for someone who wants to check.</text><circle cx="387.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="387.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="410.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Show the mailbox, not a claim about the</text><text x="410.0" y="984" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">mailbox</text><text x="374.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">At 2:40 in the video the camera cuts here. A single row</text><text x="374.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">in an inbox after a live crash is the most convincing</text><text x="374.0" y="1047" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">thing in the submission.</text><circle cx="733.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="733.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="756.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Operator view and vendor view, side by</text><text x="756.0" y="984" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">side</text><text x="720.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Eight log lines versus one email. That asymmetry is the</text><text x="720.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">entire value of idempotency, drawn without a paragraph</text><text x="720.0" y="1047" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">of explanation.</text><circle cx="1079.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1079.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="1102.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Name it as a simulated channel, in the</text><text x="1102.0" y="984" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">header</text><text x="1066.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Honesty about the mail simulator costs nothing and</text><text x="1066.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">pre-empts the one question that could undermine an</text><text x="1066.0" y="1047" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">otherwise perfect demo beat.</text></svg>