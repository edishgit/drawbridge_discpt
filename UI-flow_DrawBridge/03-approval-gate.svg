<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif">
<rect width="1240" height="820" fill="#0B0D10"/>
<rect x="0.5" y="0.5" width="1239" height="819" fill="none" stroke="#1C2128"/>
<!-- dimmed backdrop hint -->
<rect x="0" y="0" width="1240" height="820" fill="#000000" opacity="0.35"/>

<!-- modal -->
<rect x="290" y="120" width="660" height="580" rx="16" fill="#12171E" stroke="#22262D"/>
<text x="322" y="164" font-size="11" font-weight="600" fill="#D29922" letter-spacing="0.6">GATE G1 · RISK ACCEPTANCE</text>
<text x="322" y="196" font-size="20" font-weight="700" fill="#E6EAF0">Approve DataDynamo Logistics?</text>
<text x="322" y="220" font-size="12.5" fill="#8B97A6">Tier 1 · handles internal logistics data · reviewed over 9 days · 3 findings</text>

<!-- score chip -->
<rect x="322" y="244" width="180" height="88" rx="10" fill="#0E1116" stroke="#1C2128"/>
<text x="342" y="272" font-size="11" fill="#5B6673">SCORE</text>
<text x="342" y="312" font-size="34" font-weight="800" fill="#D29922">71</text>
<text x="410" y="312" font-size="12" fill="#5B6673">/100</text>
<rect x="518" y="244" width="400" height="88" rx="10" fill="#0E1116" stroke="#1C2128"/>
<text x="538" y="272" font-size="11" fill="#5B6673">TOP FINDING</text>
<text x="538" y="296" font-size="12.5" fill="#F0883E">MFA control gap contradicts questionnaire answer</text>
<text x="538" y="316" font-size="11.5" fill="#8B97A6">access control · high · SOC 2 exception 4.2</text>

<!-- conditions -->
<text x="322" y="368" font-size="12" font-weight="600" fill="#8B97A6">CONDITIONS FOR APPROVAL</text>
<rect x="322" y="380" width="596" height="96" rx="10" fill="#0E1116" stroke="#1C2128"/>
<text x="342" y="406" font-size="12" fill="#C9D3DF">☑  Remediate admin-console MFA within 30 days</text>
<text x="342" y="430" font-size="12" fill="#C9D3DF">☑  Provide updated ISO 27001 certificate (current expired)</text>
<text x="342" y="454" font-size="12" fill="#3A434F">＋  Add condition…</text>

<!-- approver identity -->
<rect x="322" y="496" width="596" height="52" rx="10" fill="#0E1116" stroke="#1C2128"/>
<circle cx="350" cy="522" r="12" fill="#22303F"/>
<text x="374" y="518" font-size="12.5" font-weight="600" fill="#E6EAF0">Elena Cortez · CISO</text>
<text x="374" y="536" font-size="11" fill="#5B6673">Signing this decision records your identity in the audit binder.</text>

<!-- actions -->
<rect x="322" y="576" width="596" height="46" rx="10" fill="#D29922"/>
<text x="620" y="604" font-size="13.5" font-weight="700" fill="#0B0D10" text-anchor="middle">Approve with conditions</text>
<rect x="322" y="632" width="290" height="44" rx="10" fill="#161B22" stroke="#2A2020"/>
<text x="467" y="659" font-size="12.5" font-weight="600" fill="#8B97A6" text-anchor="middle">Reject</text>
<rect x="628" y="632" width="290" height="44" rx="10" fill="#161B22" stroke="#1C2128"/>
<text x="773" y="659" font-size="12.5" font-weight="600" fill="#8B97A6" text-anchor="middle">Send back for more evidence</text>

<text x="620" y="742" font-size="11" fill="#5B6673" text-anchor="middle">The fleet cannot reach “decided” without a signed human token — enforced at the gateway, not the UI.</text>
<text x="1216" y="792" font-size="11" fill="#3A434F" text-anchor="end">Drawbridge UI · human gate / risk acceptance</text>
</svg>
