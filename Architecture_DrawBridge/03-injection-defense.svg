<text x="624" y="560" font-size="13.5" font-weight="600" fill="#15803D" text-anchor="middle">stamped clean</text>
<text x="624" y="580" font-size="11.5" fill="#64748B" text-anchor="middle">gateway P2 admits stamped only</text>
<line x1="774" y1="568" x2="830" y2="568" stroke="#94A3B8" stroke-width="1.25" marker-end="url(#a)"/>
