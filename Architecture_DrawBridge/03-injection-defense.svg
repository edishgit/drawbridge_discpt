<text x="1004" y="560" font-size="13.5" font-weight="600" fill="#0F766E" text-anchor="middle">Evidence agent proceeds</text>
<text x="1004" y="580" font-size="11.5" fill="#64748B" text-anchor="middle">review continues normally</text>

<line x1="280" y1="622" x2="280" y2="662" stroke="#94A3B8" stroke-width="1.25" marker-end="url(#a)"/>
<text x="294" y="648" font-size="11.5" font-weight="600" fill="#B91C1C">yes</text>
<rect x="120" y="666" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.25"/>
<text x="280" y="690" font-size="13.5" font-weight="600" fill="#991B1B" text-anchor="middle">block · strip payload</text>
<text x="280" y="710" font-size="11.5" fill="#64748B" text-anchor="middle">sanitized text only proceeds</text>
<line x1="440" y1="697" x2="470" y2="697" stroke="#94A3B8" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="474" y="666" width="300" height="62" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.25"/>
<text x="624" y="690" font-size="13.5" font-weight="600" fill="#92400E" text-anchor="middle">incident logged</text>
<text x="624" y="710" font-size="11.5" fill="#64748B" text-anchor="middle">Cloud Trace + event ledger</text>
<line x1="774" y1="697" x2="830" y2="697" stroke="#94A3B8" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="834" y="666" width="340" height="62" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.25"/>
<text x="1004" y="690" font-size="13.5" font-weight="600" fill="#991B1B" text-anchor="middle">Adversarial Conduct flag</text>
<text x="1004" y="710" font-size="11.5" fill="#64748B" text-anchor="middle">score −25 · auto-escalate to gate G1</text>

<rect x="120" y="772" width="1054" height="44" rx="8" fill="#FAF5FF" stroke="#E9D5FF"/>
<text x="647" y="799" font-size="12" fill="#6B21A8" text-anchor="middle">Both outcomes land in the Audit Binder — a clean screen, or the preserved manipulation attempt with its full trace.</text>

<text x="1192" y="842" font-size="11" fill="#94A3B8" text-anchor="end">Drawbridge · signature feature: injection defense as a product insight</text>
