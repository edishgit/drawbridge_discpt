<text x="280" y="360" font-size="11.5" fill="#64748B" text-anchor="middle">raw text never leaves the boundary</text>
<line x1="280" y1="378" x2="280" y2="408" stroke="#94A3B8" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="120" y="412" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.25"/>
<text x="280" y="436" font-size="13.5" font-weight="600" fill="#991B1B" text-anchor="middle">Model Armor screening</text>
<text x="280" y="456" font-size="11.5" fill="#64748B" text-anchor="middle">injection · tool poisoning · PII</text>
<line x1="280" y1="474" x2="280" y2="510" stroke="#94A3B8" stroke-width="1.25" marker-end="url(#a)"/>

<polygon points="280,514 390,568 280,622 170,568" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.25"/>
