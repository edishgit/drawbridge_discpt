<text x="280" y="244" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">Quarantine bucket — Cloud Storage</text>
<text x="280" y="264" font-size="11.5" fill="#64748B" text-anchor="middle">no agent ever reads raw files</text>
