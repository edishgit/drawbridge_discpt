<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="860" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="1239" height="859" fill="none" stroke="#E2E8F0"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#0F172A">Adversarial content pipeline — when a vendor attacks the reviewer</text>
<text x="48" y="70" font-size="13" fill="#64748B">Every vendor-origin byte walks this path · attempted manipulation becomes a risk signal, not just a blocked request</text>

