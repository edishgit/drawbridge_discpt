<rect x="80" y="150" width="200" height="72" rx="10" fill="#12171E" stroke="#22262D"/>
<text x="180" y="184" font-size="13" font-weight="600" fill="#E6EAF0" text-anchor="middle">Queue</text>
<text x="180" y="204" font-size="11" fill="#5B6673" text-anchor="middle">all reviews · status strip</text>

<rect x="380" y="150" width="200" height="72" rx="10" fill="#12171E" stroke="#22262D"/>
<text x="480" y="184" font-size="13" font-weight="600" fill="#E6EAF0" text-anchor="middle">New review</text>
<text x="480" y="204" font-size="11" fill="#5B6673" text-anchor="middle">intake form</text>

<rect x="380" y="290" width="200" height="72" rx="10" fill="#12171E" stroke="#22262D"/>
<text x="480" y="324" font-size="13" font-weight="600" fill="#E6EAF0" text-anchor="middle">Review timeline</text>
<text x="480" y="344" font-size="11" fill="#5B6673" text-anchor="middle">events · findings · score</text>

<rect x="680" y="290" width="200" height="72" rx="10" fill="#161226" stroke="#3A2E63"/>
