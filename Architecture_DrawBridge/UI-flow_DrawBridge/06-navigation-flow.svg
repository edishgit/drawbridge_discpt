<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#4F7CFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3A434F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="760" fill="#0B0D10"/>
<rect x="0.5" y="0.5" width="1239" height="759" fill="none" stroke="#1C2128"/>
<text x="48" y="52" font-size="22" font-weight="700" fill="#E6EAF0">UI navigation flow</text>
<text x="48" y="76" font-size="13" fill="#8B97A6">Two surfaces, one accent path · the blue route is the exact click-path the demo video follows</text>

<!-- internal surface band -->
<rect x="48" y="104" width="1144" height="360" rx="12" fill="#0E1116" stroke="#1C2128"/>
