<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif">
<rect width="1240" height="820" fill="#F7F9FB"/>
<rect x="0.5" y="0.5" width="1239" height="819" fill="none" stroke="#E2E8F0"/>
<!-- top bar -->
<rect x="0" y="0" width="1240" height="64" fill="#FFFFFF"/>
<line x1="0" y1="64" x2="1240" y2="64" stroke="#E2E8F0"/>
<rect x="40" y="22" width="18" height="18" rx="5" fill="#4F7CFF"/>
<text x="68" y="37" font-size="14" font-weight="700" fill="#0F172A">Drawbridge</text>
<text x="1200" y="37" font-size="12" fill="#64748B" text-anchor="end">Secure vendor portal · Meridian Corp</text>

<!-- content column -->
<text x="360" y="128" font-size="11" font-weight="600" fill="#4F7CFF" letter-spacing="0.6">SECURITY REVIEW</text>
<text x="360" y="160" font-size="24" font-weight="700" fill="#0F172A">Meridian Corp security questionnaire</text>
<text x="360" y="186" font-size="13" fill="#64748B">This link is unique to NimbusWrite AI and expires in 14 days. Progress saves automatically.</text>

<!-- progress -->
<rect x="360" y="212" width="520" height="8" rx="4" fill="#E2E8F0"/>
<rect x="360" y="212" width="312" height="8" rx="4" fill="#4F7CFF"/>
<text x="360" y="242" font-size="12" fill="#64748B">36 of 60 answered</text>
<text x="880" y="242" font-size="12" fill="#64748B" text-anchor="end">Section 4 of 8 · Access control</text>

<!-- question card -->
<rect x="360" y="264" width="520" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="384" y="294" font-size="11" fill="#94A3B8">QUESTION 14</text>
<text x="384" y="322" font-size="14" font-weight="600" fill="#0F172A">List the encryption standards used for data</text>
<text x="384" y="342" font-size="14" font-weight="600" fill="#0F172A">at rest and in transit, and attach your key-</text>
<text x="384" y="362" font-size="14" font-weight="600" fill="#0F172A">management policy.</text>
<rect x="384" y="378" width="472" height="1" fill="#E2E8F0"/>
<text x="384" y="400" font-size="12" fill="#94A3B8">Specific answers move your review faster than “we follow best practices.”</text>

<rect x="360" y="430" width="520" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="384" y="458" font-size="12.5" fill="#334155">AES-256 at rest, TLS 1.3 in transit. Keys rotated</text>
<text x="384" y="478" font-size="12.5" fill="#334155">every 90 days via Cloud KMS.▏</text>
<rect x="384" y="510" width="150" height="28" rx="7" fill="#F1F5F9" stroke="#E2E8F0"/>
<text x="459" y="528" font-size="11.5" fill="#475569" text-anchor="middle">📎 key-mgmt-policy.pdf</text>

<!-- upload dropzone -->
<rect x="360" y="566" width="520" height="90" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="6 5"/>
<text x="620" y="606" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Drop evidence here — SOC 2, ISO certs, policies</text>
<text x="620" y="628" font-size="11.5" fill="#94A3B8" text-anchor="middle">All uploads are scanned before review · PDF, up to 25 MB</text>

<rect x="360" y="676" width="250" height="44" rx="10" fill="#4F7CFF"/>
<text x="485" y="704" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Save &amp; continue</text>
<text x="640" y="704" font-size="12.5" fill="#64748B">Saved 12 seconds ago</text>

<text x="360" y="770" font-size="11" fill="#94A3B8">05 · Vendor portal — the counterparty's only surface. Calm, trustworthy, one clear task. ~15s of demo screen time.</text>
<text x="1200" y="792" font-size="11" fill="#CBD5E1" text-anchor="end">Drawbridge UI · vendor portal (external)</text>
</svg>
