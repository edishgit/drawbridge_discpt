<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1240" height="660" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="1239" height="659" fill="none" stroke="#E2E8F0"/>
<text x="48" y="46" font-size="22" font-weight="700" fill="#0F172A">Memory hierarchy — persistence is not memory</text>
<text x="48" y="70" font-size="13" fill="#64748B">Three layers, three jobs · what dies with a crash, what resumes the workflow, what remembers the vendor next year</text>

<rect x="90" y="130" width="780" height="110" rx="10" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.25"/>
<text x="114" y="160" font-size="14" font-weight="600" fill="#0F766E">L1 · Session state — Agent Engine runtime</text>
<text x="114" y="186" font-size="11.5" fill="#475569">in-flight reasoning, tool context, working notes</text>
<text x="114" y="206" font-size="11.5" fill="#475569">cheap and disposable by design</text>
<rect x="900" y="130" width="280" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="924" y="160" font-size="12" font-weight="600" fill="#334155">lifetime: seconds–minutes</text>
<text x="924" y="186" font-size="11.5" fill="#64748B">survives a crash: no</text>
<text x="924" y="206" font-size="11.5" fill="#64748B">— and that is fine</text>

<line x1="480" y1="240" x2="480" y2="266" stroke="#94A3B8" stroke-width="1.25" marker-end="url(#a)"/>
<text x="500" y="258" font-size="11" fill="#64748B">checkpoint every step</text>

<rect x="90" y="270" width="780" height="110" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.25"/>
<text x="114" y="300" font-size="14" font-weight="600" fill="#3730A3">L2 · Durable workflow ledger — Firestore</text>
<text x="114" y="326" font-size="11.5" fill="#475569">checkpoints · ordered event log · idempotency keys</text>
<text x="114" y="346" font-size="11.5" fill="#475569">the exact resume point after any failure</text>
<rect x="900" y="270" width="280" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="924" y="300" font-size="12" font-weight="600" fill="#334155">lifetime: days–weeks</text>
<text x="924" y="326" font-size="11.5" fill="#64748B">survives a crash: yes</text>
<text x="924" y="346" font-size="11.5" fill="#64748B">exactly-once side effects</text>

<line x1="480" y1="380" x2="480" y2="406" stroke="#94A3B8" stroke-width="1.25" marker-end="url(#a)"/>
<text x="500" y="398" font-size="11" fill="#64748B">distill what matters</text>

<rect x="90" y="410" width="780" height="110" rx="10" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.25"/>
<text x="114" y="440" font-size="14" font-weight="600" fill="#6B21A8">L3 · Memory Bank — cross-session memory</text>
<text x="114" y="466" font-size="11.5" fill="#475569">vendor dossiers · negotiation history · prior findings</text>
<text x="114" y="486" font-size="11.5" fill="#475569">org policy memory: "data processors need SOC 2 Type II"</text>
<rect x="900" y="410" width="280" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="924" y="440" font-size="12" font-weight="600" fill="#334155">lifetime: months–years</text>
<text x="924" y="466" font-size="11.5" fill="#64748B">survives everything</text>
<text x="924" y="486" font-size="11.5" fill="#64748B">powers the second review</text>

<rect x="90" y="556" width="1090" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="635" y="581" font-size="12" fill="#475569" text-anchor="middle">Crash on Tuesday, finish the job on Wednesday, remember the vendor in December — each layer has exactly one job.</text>

<text x="1192" y="640" font-size="11" fill="#94A3B8" text-anchor="end">Drawbridge · state and memory design</text>
</svg>
