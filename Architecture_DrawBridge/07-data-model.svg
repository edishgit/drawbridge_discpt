<rect x="60" y="838" width="1130" height="72" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="625" y="866" font-size="12" fill="#475569" text-anchor="middle">Beyond Firestore: vendor dossiers and org policy memory live in Memory Bank; raw evidence lives in Cloud Storage (quarantine/ → clean/).</text>
<text x="625" y="890" font-size="12" fill="#475569" text-anchor="middle">Every side-effecting step writes its idempotency key first — the reason a resumed review never emails a vendor twice.</text>

<text x="1192" y="962" font-size="11" fill="#94A3B8" text-anchor="end">Drawbridge · data architecture and models</text>
