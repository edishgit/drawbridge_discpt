<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" width="1440" height="1100"><title>Drawbridge — Vendor portal (untrusted zone)</title><rect width="1440" height="1100" fill="#ffffff"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#ffffff"/><line x1="0" y1="64" x2="1440" y2="64" stroke="#e2e8f0" stroke-width="1"/><rect x="28" y="20" width="24" height="24" rx="6" fill="#1d4ed8"/><text x="40" y="37" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">D</text><text x="62" y="38" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">Drawbridge</text><text x="176" y="38" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">Secure vendor portal</text><text x="1412" y="32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="end">Signed in via one-time link</text><text x="1412" y="50" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="end">leah@nimbuswrite.ai · expires in 11 days</text><rect x="0" y="64" width="1440" height="836" rx="0" fill="#f8fafc"/><rect x="0" y="64" width="1440" height="132" rx="0" fill="#ffffff"/><line x1="0" y1="196" x2="1440" y2="196" stroke="#e2e8f0" stroke-width="1"/><text x="28" y="110" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">Security review — requested by Northwind Systems</text><text x="28" y="136" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">NimbusWrite AI · Tier 1 assessment · 60 questions across 8 domains · due 22 August 2026</text><rect x="28" y="158" width="900" height="10" rx="5" fill="#e2e8f0"/><rect x="28" y="158" width="360" height="10" rx="5" fill="#1d4ed8"/><text x="28" y="186" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">24 of 60 answered · 3 of 5 documents uploaded · you can save and return at any time</text><rect x="1180" y="120" width="232" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="1296.0" y="146.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="middle">Save and exit</text><rect x="28" y="224" width="880" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="52" y="256" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="800" text-anchor="start">DOMAIN 2 · ACCESS CONTROL &amp; IDENTITY  ·  QUESTION 14 OF 60</text><text x="52" y="290" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="start">Describe how multi-factor authentication is enforced across your environment. State</text><text x="52" y="312" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="start">which account types are covered, name any exceptions including administrative</text><text x="52" y="334" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#0f172a" font-weight="600" text-anchor="start">access, and attach the policy document that governs it.</text><rect x="52" y="364" width="832" height="86" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/><text x="468.0" y="412.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="500" text-anchor="middle">Answer — long form. Evidence-demanding questions, never yes/no.</text><rect x="52" y="464" width="220" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="162" y="488" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">📎  Attach policy</text><text x="292" y="488" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#15803d" font-weight="600" text-anchor="start">MFA-policy-v3.pdf attached</text><rect x="700" y="464" width="184" height="38" rx="8" fill="#1d4ed8"/><text x="792.0" y="488.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">Next question</text><rect x="936" y="224" width="476" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="960" y="256" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="800" text-anchor="start">EVIDENCE</text><rect x="960" y="272" width="428" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/><text x="1174" y="314" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" font-weight="600" text-anchor="middle">Drop files here</text><text x="1174" y="336" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="middle">SOC 2, ISO certificates, policies · PDF, max 25 MB</text><text x="960" y="416" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">SOC 2 Type II 2025.pdf</text><rect x="1300" y="402" width="70" height="22" rx="11" fill="#ffffff" stroke="#15803d" stroke-width="1"/><text x="1335.0" y="416.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#15803d" font-weight="600" text-anchor="middle">RECEIVED</text><line x1="960" y1="430" x2="1388" y2="430" stroke="#e2e8f0" stroke-width="1"/><text x="960" y="456" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">ISO 27001 cert.pdf</text><rect x="1300" y="442" width="70" height="22" rx="11" fill="#ffffff" stroke="#15803d" stroke-width="1"/><text x="1335.0" y="456.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#15803d" font-weight="600" text-anchor="middle">RECEIVED</text><line x1="960" y1="470" x2="1388" y2="470" stroke="#e2e8f0" stroke-width="1"/><text x="960" y="496" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">Security-Overview.pdf</text><rect x="1300" y="482" width="82" height="22" rx="11" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="1341.0" y="496.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#b45309" font-weight="600" text-anchor="middle">PROCESSING</text><line x1="960" y1="510" x2="1388" y2="510" stroke="#e2e8f0" stroke-width="1"/><rect x="28" y="552" width="880" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="52" y="584" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="800" text-anchor="start">WHY THIS TAKES 60 QUESTIONS</text><text x="52" y="612" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start">Northwind&#x27;s reviewers read every answer against the evidence you attach. Specific answers with documents</text><text x="52" y="632" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start">shorten the review; vague answers generate follow-ups. Everything you submit is processed automatically and</text><text x="52" y="652" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start">screened before a reviewer sees it.</text><text x="52" y="682" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8" font-weight="600" text-anchor="start">Questions about the review? Reply to the thread with Northwind — a human reads it.</text><rect x="936" y="552" width="476" height="150" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="960" y="584" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#b91c1c" font-weight="800" text-anchor="start">THIS IS THE UNTRUSTED ZONE</text><text x="960" y="612" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d" font-weight="400" text-anchor="start">Everything submitted here is authored by the party</text><text x="960" y="630" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d" font-weight="400" text-anchor="start">under review. Uploads land in a quarantine bucket</text><text x="960" y="648" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d" font-weight="400" text-anchor="start">that no agent can read, are text-extracted locally,</text><text x="960" y="666" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d" font-weight="400" text-anchor="start">PII-scrubbed, and screened by Model Armor before any</text><text x="960" y="684" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d" font-weight="400" text-anchor="start">model sees a word.</text><text x="960" y="690" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" font-weight="400" text-anchor="start" font-style="italic">Annotation for the reader — not shown to the vendor.</text><circle cx="884" cy="248" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="884" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="1392" cy="248" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1392" y="253" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="884" cy="576" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="884" y="581" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="936" cy="120" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="936" y="125" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><rect x="0" y="900" width="1440" height="200" rx="0" fill="#0b1220"/><text x="28" y="932" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" font-weight="700" text-anchor="start">WHY IT LOOKS LIKE THIS</text><circle cx="41.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="41.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="64.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">One question at a time, not a 60-row</text><text x="64.0" y="984" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">form</text><text x="28.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">The style rule from the question bank shows up as UI:</text><text x="28.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">long-form answers with an attachment slot. A</text><text x="28.0" y="1047" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">spreadsheet-shaped form produces spreadsheet-shaped</text><text x="28.0" y="1064" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">answers.</text><circle cx="387.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="387.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="410.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Uploads show a processing state</text><text x="374.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">&#x27;Processing&#x27; is the screening pipeline, visible to the</text><text x="374.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">vendor. It is honest, and on camera it is the fifteen</text><text x="374.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">seconds before the injection is caught.</text><circle cx="733.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="733.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="756.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Explain the ask</text><text x="720.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">The vendor is a person doing unpaid work. One short</text><text x="720.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">paragraph on why specificity shortens the review buys</text><text x="720.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">better answers than any amount of chasing.</text><circle cx="1079.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1079.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="1102.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Deliberately minimal</text><text x="1066.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">This surface earns about fifteen seconds of screen</text><text x="1066.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">time. Build it, do not polish it — every hour here is</text><text x="1066.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">an hour not spent on the dashboard.</text></svg>