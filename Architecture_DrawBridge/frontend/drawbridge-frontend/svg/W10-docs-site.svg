<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" width="1440" height="1100"><title>Drawbridge — Docs site</title><rect width="1440" height="1100" fill="#ffffff"/><rect x="0" y="0" width="1440" height="900" rx="0" fill="#0b1220"/><rect x="0" y="0" width="1440" height="60" rx="0" fill="#111c2e"/><line x1="0" y1="60" x2="1440" y2="60" stroke="#1e293b" stroke-width="1"/><rect x="28" y="18" width="24" height="24" rx="6" fill="#1d4ed8"/><text x="40" y="35" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">D</text><text x="62" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#e2e8f0" font-weight="700" text-anchor="start">Drawbridge docs</text><text x="276.4" y="35" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="600" text-anchor="middle">Overview</text><text x="399.8" y="35" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="600" text-anchor="middle">Getting started</text><rect x="480.8" y="16" width="115.19999999999999" height="28" rx="6" fill="#172554"/><text x="538.4" y="35" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#60a5fa" font-weight="600" text-anchor="middle">Architecture</text><text x="650.4" y="35" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="600" text-anchor="middle">Security</text><text x="751.0" y="35" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="600" text-anchor="middle">Live demo</text><rect x="1120" y="16" width="180" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/><text x="1210" y="35" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">Search docs  ⌘K</text><rect x="1318" y="18" width="107" height="22" rx="11" fill="#172554" stroke="#93c5fd" stroke-width="1"/><text x="1371.5" y="32.96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#93c5fd" font-weight="600" text-anchor="middle">v1.2 · GitHub</text><rect x="0" y="60" width="260" height="840" rx="0" fill="#111c2e"/><text x="28" y="114" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="800" text-anchor="start">ARCHITECTURE</text><rect x="16" y="132" width="228" height="30" rx="6" fill="#172554"/><rect x="16" y="132" width="3" height="30" rx="2" fill="#1d4ed8"/><text x="32" y="152" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#60a5fa" font-weight="600" text-anchor="start">01 System overview</text><text x="32" y="182" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">02 The fleet</text><text x="32" y="212" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">03 Event backbone</text><text x="32" y="242" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">04 Memory hierarchy</text><text x="32" y="272" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">05 State machine</text><text x="32" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">06 Idempotency &amp; resume</text><text x="28" y="328" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="800" text-anchor="start">SECURITY</text><text x="32" y="366" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">07 Trust zones</text><text x="32" y="396" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">08 Adversarial content</text><text x="32" y="426" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">09 Permission matrix</text><text x="32" y="456" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">10 Human gates</text><text x="28" y="482" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="800" text-anchor="start">OPERATIONS</text><text x="32" y="520" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">11 Deployment &amp; cost</text><text x="32" y="550" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">12 Audit binder</text><text x="300" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#e2e8f0" font-weight="700" text-anchor="start">01 · System overview</text><rect x="300" y="146" width="700" height="64" rx="8" fill="#0f1a2e" stroke="#1e293b" stroke-width="1"/><rect x="300" y="146" width="3" height="64" rx="2" fill="#1d4ed8"/><text x="320" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#60a5fa" font-weight="700" text-anchor="start">Canonical · read this first</text><text x="320" y="194" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Untrusted content → screening → gateway → fleet → state → governance. Eight zones, two claims.</text><text x="300" y="254" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#e2e8f0" font-weight="700" text-anchor="start">The whole system on one page</text><rect x="300" y="276" width="1080" height="300" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/><text x="840" y="410" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">[ embedded diagram 01 — system architecture ]</text><text x="840" y="436" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">rendered from the same .mmd source shipped in docs/diagrams/</text><rect x="1240" y="292" width="74" height="22" rx="11" fill="#172554" stroke="#93c5fd" stroke-width="1"/><text x="1277.0" y="306.96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#93c5fd" font-weight="600" text-anchor="middle">⤢ Expand</text><rect x="1240" y="320" width="107" height="22" rx="11" fill="#172554" stroke="#93c5fd" stroke-width="1"/><text x="1293.5" y="334.96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#93c5fd" font-weight="600" text-anchor="middle">⧉ Copy source</text><text x="300" y="606" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">Every zone is detailed in its own page (number in parentheses). The fleet knows nothing about vendor risk that is not in</text><text x="300" y="628" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">the rubric and the question bank — the domain lives in configuration, not in prompts.</text><rect x="300" y="668" width="1080" height="86" rx="8" fill="#0f1a2e" stroke="#1e293b" stroke-width="1"/><text x="324" y="700" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#60a5fa" font-weight="800" text-anchor="start">Try it</text><text x="324" y="726" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#86efac" font-weight="400" text-anchor="start">make bootstrap &amp;&amp; make seed &amp;&amp; make deploy &amp;&amp; make demo --vendor nimbuswrite</text><text x="324" y="746" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">Thirty minutes from a clean project to a blocked injection.</text><text x="1180" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="800" text-anchor="start">ON THIS PAGE</text><text x="1180" y="148" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#60a5fa" font-weight="400" text-anchor="start">The whole system on one page</text><text x="1180" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">Trust zones</text><text x="1180" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">The runtime loop</text><text x="1180" y="220" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">Where state lives</text><text x="1180" y="244" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">What each agent may do</text><circle cx="280" cy="180" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="280" y="185" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="1360" cy="292" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1360" y="297" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="1360" cy="682" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1360" y="687" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="240" cy="100" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="240" y="105" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><rect x="0" y="900" width="1440" height="200" rx="0" fill="#0b1220"/><text x="28" y="932" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" font-weight="700" text-anchor="start">WHY IT LOOKS LIKE THIS</text><circle cx="41.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="41.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="64.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Every page opens with a one-line summary</text><text x="28.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Status, priority, and the page in a single sentence. A</text><text x="28.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">judge sampling three pages learns the shape of the</text><text x="28.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">system without reading any of them fully.</text><circle cx="387.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="387.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="410.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Diagrams are embedded, expandable, and</text><text x="410.0" y="984" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">copyable</text><text x="374.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Same .mmd sources that ship in docs/diagrams/. &#x27;Copy</text><text x="374.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">source&#x27; signals the diagrams are generated artefacts,</text><text x="374.0" y="1047" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">not screenshots of a whiteboard.</text><circle cx="733.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="733.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="756.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">A runnable command on the canonical page</text><text x="720.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">The README spin-up is a graded item. Repeating the</text><text x="720.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">four-command path inside the docs is where a judge</text><text x="720.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">decides whether they believe it.</text><circle cx="1079.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1079.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="1102.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Numbered pages, grouped by concern</text><text x="1066.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Architecture, Security, Operations. The numbering</text><text x="1066.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">matches the diagram set, so a reference in the video or</text><text x="1066.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">the article lands somewhere specific.</text></svg>