<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" width="1440" height="1100"><title>Drawbridge — P1 gate and NEEDS_HUMAN</title><rect width="1440" height="1100" fill="#ffffff"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#ffffff"/><line x1="0" y1="64" x2="1440" y2="64" stroke="#e2e8f0" stroke-width="1"/><rect x="28" y="20" width="24" height="24" rx="6" fill="#1d4ed8"/><text x="40" y="37" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">D</text><text x="62" y="38" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">Drawbridge</text><rect x="192" y="18" width="66" height="28" rx="6" fill="#dbeafe"/><text x="225.0" y="37" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">Queue</text><text x="309.0" y="37" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748b" font-weight="600" text-anchor="middle">Vendors</text><text x="401.0" y="37" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748b" font-weight="600" text-anchor="middle">Binders</text><text x="481.0" y="37" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748b" font-weight="600" text-anchor="middle">Docs</text><text x="612" y="26" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start">ACTIVE REVIEWS</text><text x="612" y="45" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">3</text><text x="738" y="26" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start">EVENTS PROCESSED</text><text x="738" y="45" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">1,284</text><text x="864" y="26" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start">SPEND TODAY</text><text x="864" y="45" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">$2.17</text><text x="990" y="26" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start">AVG / REVIEW</text><text x="990" y="45" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">$0.41</text><rect x="1140" y="21" width="239" height="22" rx="11" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="1259.5" y="35.96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" font-weight="600" text-anchor="middle">TIME-COMPRESSED DEMO · 1s = 4 min</text><rect x="0" y="64" width="1440" height="836" rx="0" fill="#f8fafc"/><text x="28" y="116" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">Two things need a human</text><text x="28" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">The fleet parked both rather than guessing. Neither is an error state.</text><rect x="28" y="172" width="680" height="420" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><rect x="28" y="172" width="680" height="52" rx="0" fill="#ffedd5"/><text x="52" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#c2410c" font-weight="800" text-anchor="start">P1 · FIRST OUTBOUND CONTACT</text><rect x="560" y="183" width="130" height="22" rx="11" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="625.0" y="197.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#c2410c" font-weight="600" text-anchor="middle">BLOCKED BY GATEWAY</text><text x="52" y="254" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">The Questionnaire agent wants to email a vendor for the first time.</text><text x="52" y="278" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start">NimbusWrite AI · leah@nimbuswrite.ai · 60 questions, Tier 1</text><rect x="52" y="298" width="632" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="72" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">Subject: Security review — Northwind Systems</text><line x1="72" y1="336" x2="664" y2="336" stroke="#e2e8f0" stroke-width="1"/><text x="72" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Hello Leah — Northwind Systems is beginning a security review of NimbusWrite</text><text x="72" y="379" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">AI ahead of contracting. Please complete the questionnaire at the secure link</text><text x="72" y="398" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">below. It has 60 questions across eight domains and asks for supporting</text><text x="72" y="417" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">evidence; you can save and return.</text><text x="72" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#1d4ed8" font-weight="400" text-anchor="start">[secure portal link · token-scoped, expires in 14 days]</text><rect x="52" y="502" width="240" height="42" rx="8" fill="#c2410c"/><text x="172.0" y="528.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">Authorise this thread</text><rect x="304" y="502" width="150" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="379.0" y="528.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="middle">Edit message</text><rect x="466" y="502" width="120" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="526.0" y="528.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="middle">Decline</text><text x="52" y="568" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">One tap authorises the thread; later messages are delegated. Review parked in GATED, scope contact.</text><rect x="732" y="172" width="680" height="420" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><rect x="732" y="172" width="680" height="52" rx="0" fill="#fee2e2"/><text x="756" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" font-weight="800" text-anchor="start">NEEDS HUMAN · THE FLEET STOPPED</text><rect x="1252" y="183" width="88" height="22" rx="11" fill="#ffffff" stroke="#b91c1c" stroke-width="1"/><text x="1296.0" y="197.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#b91c1c" font-weight="600" text-anchor="middle">NO GUESSING</text><text x="756" y="254" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Northwind Payroll — three chases, no reply.</text><text x="756" y="278" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start">Questionnaire agent · last contact Day 9 · coverage 34%</text><rect x="756" y="298" width="632" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="776" y="324" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8" font-weight="800" text-anchor="start">WHAT THE FLEET DID</text><text x="776" y="348" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">Day 2 · questionnaire sent, delivery confirmed</text><text x="776" y="372" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">Day 5 · chase round 1 — reminder</text><text x="776" y="396" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">Day 7 · chase round 2 — deadline notice</text><text x="776" y="420" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="400" text-anchor="start">Day 9 · chase round 3 — escalation. Cap reached; review parked.</text><text x="756" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#94a3b8" font-weight="800" text-anchor="start">WHAT IT WILL NOT DO</text><text x="776" y="500" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="400" text-anchor="start">· Score a vendor on 34% coverage.</text><text x="776" y="520" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="400" text-anchor="start">· Infer missing answers from the documents it does have.</text><rect x="756" y="548" width="210" height="40" rx="8" fill="#b91c1c"/><text x="861.0" y="573.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">Reassign to a person</text><rect x="978" y="548" width="180" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="1068.0" y="573.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="middle">Extend and retry</text><rect x="28" y="620" width="1384" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="52" y="652" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="800" text-anchor="start">DEAD-LETTER QUEUE · 0 messages</text><text x="52" y="682" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start">No message has failed five delivery attempts. If one does, its review moves to NEEDS_HUMAN and appears here — visible failure handling, not a silent retry loop.</text><text x="52" y="706" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">Ack deadline 60s, extended explicitly around long model calls.</text><rect x="1200" y="650" width="68" height="22" rx="11" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="1234.0" y="664.96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="middle">HEALTHY</text><circle cx="688" cy="262" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="688" y="267" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="1392" cy="262" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1392" y="267" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="1392" cy="644" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1392" y="649" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="688" cy="522" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="688" y="527" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><rect x="0" y="900" width="1440" height="200" rx="0" fill="#0b1220"/><text x="28" y="932" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" font-weight="700" text-anchor="start">WHY IT LOOKS LIKE THIS</text><circle cx="41.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="41.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="64.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Show the message before it is sent</text><text x="28.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Autonomy that asks permission is a stronger claim than</text><text x="28.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">autonomy that does not. The human reads the actual</text><text x="28.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">email, not a summary of it.</text><circle cx="387.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="387.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="410.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">A stall is a feature, presented as one</text><text x="374.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">&#x27;The fleet stopped&#x27; with what it did and what it</text><text x="374.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">refuses to do. Framing this as a designed behaviour</text><text x="374.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">rather than an error is the difference between mature</text><text x="374.0" y="1047" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">and broken.</text><circle cx="733.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="733.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="756.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">The DLQ panel is visible when empty</text><text x="720.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">An empty failure panel says the mechanism exists and is</text><text x="720.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">being watched. A panel that only appears on failure</text><text x="720.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">looks like it was added after the failure.</text><circle cx="1079.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1079.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="1102.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Both cards state the mechanism in small</text><text x="1102.0" y="984" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">print</text><text x="1066.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">&#x27;Parked in GATED, scope contact&#x27; and &#x27;cap reached&#x27; tell</text><text x="1066.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">an engineer judge that the state machine is real and</text><text x="1066.0" y="1047" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">that these screens are not mock-ups.</text></svg>