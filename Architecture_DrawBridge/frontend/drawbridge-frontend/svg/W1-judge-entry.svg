<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" width="1440" height="1100"><title>Drawbridge — Judge entry / hosted URL</title><rect width="1440" height="1100" fill="#ffffff"/><rect x="0" y="0" width="1440" height="470" rx="0" fill="#0b1220"/><rect x="56" y="44" width="26" height="26" rx="7" fill="#1d4ed8"/><text x="69" y="63" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#fff" font-weight="800" text-anchor="middle">D</text><text x="94" y="64" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#e2e8f0" font-weight="700" text-anchor="start">Drawbridge</text><rect x="232" y="45" width="193" height="22" rx="11" fill="#172554" stroke="#93c5fd" stroke-width="1"/><text x="328.5" y="59.96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#93c5fd" font-weight="600" text-anchor="middle">Fortified Enterprise Fleet</text><text x="1384" y="64" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" font-weight="500" text-anchor="end">github.com/ambrstack/drawbridge</text><text x="56" y="168" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" fill="#f8fafc" font-weight="700" text-anchor="start">Vendor security review, run end to end by a fleet of agents.</text><text x="56" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" fill="#3b82f6" font-weight="700" text-anchor="start">Weeks of elapsed time. Minutes of human time. Every decision traced.</text><text x="56" y="258" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">30% of breaches now involve a third party — double last year. The only gate protecting an enterprise from a</text><text x="56" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">risky vendor is a 60-question spreadsheet and a three-week email thread. Drawbridge replaces it, and raises</text><text x="56" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">a vendor&#x27;s risk score when their documents try to prompt-inject the reviewer.</text><rect x="56" y="352" width="424" height="150" rx="12" fill="#111c2e" stroke="#1e293b" stroke-width="1"/><rect x="56" y="352" width="4" height="150" rx="2" fill="#1d4ed8"/><text x="82" y="384" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="800" text-anchor="start">WATCH</text><text x="82" y="412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#f1f5f9" font-weight="700" text-anchor="start">The 4-minute demo</text><text x="82" y="438" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">Injection blocked · runtime killed live ·</text><text x="82" y="457" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">human gate · audit binder.</text><text x="454" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="end">→</text><rect x="504" y="352" width="424" height="150" rx="12" fill="#111c2e" stroke="#1e293b" stroke-width="1"/><rect x="504" y="352" width="4" height="150" rx="2" fill="#15803d"/><text x="530" y="384" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="800" text-anchor="start">EXPLORE</text><text x="530" y="412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#f1f5f9" font-weight="700" text-anchor="start">A completed review, read-only</text><text x="530" y="438" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">NimbusWrite AI, Tier 1 — the review that</text><text x="530" y="457" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">caught an injection attempt.</text><text x="902" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#15803d" font-weight="700" text-anchor="end">→</text><rect x="952" y="352" width="424" height="150" rx="12" fill="#111c2e" stroke="#1e293b" stroke-width="1"/><rect x="952" y="352" width="4" height="150" rx="2" fill="#6d28d9"/><text x="978" y="384" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="800" text-anchor="start">READ</text><text x="978" y="412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#f1f5f9" font-weight="700" text-anchor="start">Architecture &amp; security docs</text><text x="978" y="438" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">Trust zones, the permission matrix, the</text><text x="978" y="457" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">idempotency guard.</text><text x="1350" y="478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#6d28d9" font-weight="700" text-anchor="end">→</text><rect x="0" y="470" width="1440" height="110" rx="0" fill="#f8fafc"/><line x1="0" y1="470" x2="1440" y2="470" stroke="#e2e8f0" stroke-width="1"/><text x="56" y="506" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="800" text-anchor="start">LIVE, RIGHT NOW</text><text x="56" y="548" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">24</text><text x="56" y="568" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">Reviews completed</text><text x="328" y="548" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">3</text><text x="328" y="568" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">Injection attempts blocked</text><text x="600" y="548" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">$0.41</text><text x="600" y="568" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">Median model cost / review</text><text x="872" y="548" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">6 days</text><text x="872" y="568" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">Longest review resumed after crash</text><text x="1144" y="548" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">41</text><text x="1144" y="568" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">Human minutes per review</text><text x="56" y="634" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="800" text-anchor="start">HOW IT WORKS</text><rect x="56" y="652" width="150" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="131.0" y="676" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="middle">01</text><text x="131.0" y="694" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Intake</text><text x="214" y="684" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1" font-weight="700" text-anchor="middle">›</text><rect x="224" y="652" width="150" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="299.0" y="676" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="middle">02</text><text x="299.0" y="694" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Tier &amp; plan</text><text x="382" y="684" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1" font-weight="700" text-anchor="middle">›</text><rect x="392" y="652" width="150" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="467.0" y="676" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="middle">03</text><text x="467.0" y="694" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Questionnaire</text><text x="550" y="684" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1" font-weight="700" text-anchor="middle">›</text><rect x="560" y="652" width="150" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="635.0" y="676" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="middle">04</text><text x="635.0" y="694" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Screen evidence</text><text x="718" y="684" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1" font-weight="700" text-anchor="middle">›</text><rect x="728" y="652" width="150" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="803.0" y="676" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="middle">05</text><text x="803.0" y="694" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Cross-examine</text><text x="886" y="684" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1" font-weight="700" text-anchor="middle">›</text><rect x="896" y="652" width="150" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="971.0" y="676" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="middle">06</text><text x="971.0" y="694" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Score</text><text x="1054" y="684" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1" font-weight="700" text-anchor="middle">›</text><rect x="1064" y="652" width="150" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1139.0" y="676" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="middle">07</text><text x="1139.0" y="694" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Human gate</text><text x="1222" y="684" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1" font-weight="700" text-anchor="middle">›</text><rect x="1232" y="652" width="150" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="1307.0" y="676" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" font-weight="700" text-anchor="middle">08</text><text x="1307.0" y="694" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Monitor</text><rect x="56" y="742" width="1328" height="96" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/><text x="80" y="776" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#c2410c" font-weight="800" text-anchor="start">The thing to look at first</text><text x="80" y="800" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#7c2d12" font-weight="400" text-anchor="start">A vendor&#x27;s uploaded PDF contained hidden white-on-white text instructing the reviewing agent to mark them low-risk and skip evidence checks.</text><text x="80" y="820" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#7c2d12" font-weight="400" text-anchor="start">Drawbridge blocked it, kept it as inert evidence, and raised the vendor&#x27;s risk score for attempted manipulation — because that attempt is itself a</text><text x="80" y="840" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#7c2d12" font-weight="400" text-anchor="start">finding.</text><rect x="1180" y="772" width="180" height="22" rx="11" fill="#ffedd5" stroke="#c2410c" stroke-width="1"/><text x="1270.0" y="787.32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#c2410c" font-weight="600" text-anchor="middle">See it in the review →</text><circle cx="500" cy="382" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="500" y="387" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="576" cy="540" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="576" y="545" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="1160" cy="760" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1160" y="765" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="206" cy="676" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="206" y="681" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><rect x="0" y="900" width="1440" height="200" rx="0" fill="#0b1220"/><text x="28" y="932" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" font-weight="700" text-anchor="start">WHY IT LOOKS LIKE THIS</text><circle cx="41.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="41.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="64.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Three doors, no login</text><text x="28.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">The hosted URL must load logged-out (§9). A judge with</text><text x="28.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">eight minutes should never hit an auth wall or an empty</text><text x="28.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">dashboard. Video, live review, docs — one click each.</text><circle cx="387.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="387.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="410.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Numbers no one else can show</text><text x="374.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Per-review model cost, blocked attempts,</text><text x="374.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">resumed-after-crash. These come from real fields</text><text x="374.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">(cost_usd, screenings) so they are claims you can</text><text x="374.0" y="1047" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">defend, not marketing.</text><circle cx="733.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="733.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="756.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">Lead with the differentiator</text><text x="720.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">The injection-as-risk-signal story is the one thing a</text><text x="720.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">judge will retell to a colleague. It goes above the</text><text x="720.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">fold, in plain language, with a link straight into the</text><text x="720.0" y="1047" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">evidence.</text><circle cx="1079.0" cy="962" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="1079.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="1102.0" y="967" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e2e8f0" font-weight="700" text-anchor="start">The pipeline in eight words</text><text x="1066.0" y="996" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">Someone who reads nothing else still learns what the</text><text x="1066.0" y="1013" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">fleet does. This strip is the only &#x27;marketing&#x27; element</text><text x="1066.0" y="1030" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="start">on the page.</text></svg>